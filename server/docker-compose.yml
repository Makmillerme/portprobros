# DuckDNS на VPS. Тунель Rust — WireGuard + iptables (`server/vps-wireguard-setup.sh`).

services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Kyiv
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
